<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pigeon Clicker Ultimate</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-hover: #334155;
            --accent: #38bdf8;
            --accent-gold: #fbbf24;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-layout {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 24px;
            width: 100%;
            max-width: 1100px;
            height: 85vh;
        }

        .game-container {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border-radius: var(--radius);
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* GRID DE ESTADÍSTICAS */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 16px;
            border-radius: var(--radius);
            text-align: center;
            transition: transform 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
        }

        .main-stat {
            grid-column: span 2;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.1), rgba(15, 23, 42, 0));
            border-color: rgba(56, 189, 248, 0.2);
        }

        .main-stat #contador {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--accent);
        }

        .stat-sub {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .stat-icon {
            font-size: 1.2rem;
            margin-bottom: 4px;
            display: block;
        }

        .stat-val {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .stat-lbl {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ÁREA CENTRAL DE JUEGO */
        .click-zone {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        #paloma-principal {
            font-size: 7rem;
            cursor: pointer;
            transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));
        }

        #paloma-principal:active {
            transform: scale(0.9);
        }

        /* EFECTO DE TEXTO FLOTANTE (+1) */
        .floating-text {
            position: absolute;
            color: var(--accent);
            font-weight: bold;
            font-size: 1.5rem;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100px) scale(0.8); opacity: 0; }
        }

        /* PANELES LATERALES Y DE ACCIONES */
        .upgrades-panel {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .panel-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .upgrade-item {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 12px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .upgrade-item:hover:not(.disabled) {
            background: var(--bg-hover);
        }

        .upgrade-item.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .upgrade-info p {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .upgrade-info span {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .upgrade-cost {
            font-weight: bold;
            color: var(--accent-gold);
            font-size: 0.9rem;
        }

        .action-panel {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            color: #fff;
        }

        .btn-rebirth {
            background: linear-gradient(135deg, #a855f7, #6b21a8);
            box-shadow: 0 4px 12px rgba(168, 85, 247, 0.3);
        }

        .btn-rebirth:hover { background: linear-gradient(135deg, #b55fe6, #7926be); }

        .btn-nav {
            background: #475569;
        }

        .btn-nav:hover { background: #64748b; }

        /* EVENTOS DINÁMICOS */
        .war-panel {
            position: absolute;
            top: 90px;
            left: 24px;
            right: 24px;
            background: linear-gradient(135deg, #b91c1c, #7f1d1d);
            padding: 12px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
            animation: pulse 2s infinite;
        }

        .war-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .progress-bar-bg {
            background: rgba(0,0,0,0.3);
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            background: #fff;
            width: 100%;
            height: 100%;
            transition: width 0.1s linear;
        }

        .golden-pigeon {
            position: absolute;
            font-size: 2.5rem;
            cursor: pointer;
            animation: floatGolden 4s ease-in-out infinite;
            z-index: 10;
            filter: drop-shadow(0 0 10px var(--accent-gold));
        }

        @keyframes floatGolden {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        @media (max-width: 768px) {
            .game-layout { grid-template-columns: 1fr; height: auto; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .main-stat { grid-column: span 2; }
            .upgrades-panel { height: 300px; }
        }
    </style>
</head>
<body>

<div class="game-layout">
    <!-- PANEL PRINCIPAL -->
    <div class="game-container">
        <!-- CONTROL DE RENDIMIENTO -->
        <div class="stats-grid">
            <div class="stat-card main-stat">
                <div id="contador">0 Palomas</div>
                <div class="stat-sub">Multiplicador: <span id="mult-txt">x1.0</span></div>
            </div>
            <div class="stat-card">
                <span class="stat-icon">⚡</span>
                <div class="stat-val" id="pps-txt">0.0</div>
                <div class="stat-lbl">PPS</div>
            </div>
            <div class="stat-card">
                <span class="stat-icon">🛡️</span>
                <div class="stat-val" id="defensas-txt">0</div>
                <div class="stat-lbl">Defensas</div>
            </div>
            <div class="stat-card">
                <span class="stat-icon">✨</span>
                <div class="stat-val" id="poder-txt">0</div>
                <div class="stat-lbl">Poder</div>
            </div>
        </div>

        <!-- EVENTO DE GUERRA DINÁMICO -->
        <div id="guerra-panel" class="war-panel" style="display:none;">
            <div class="war-header">
                <span>⚠️ ¡GUERRA EN CURSO!</span>
                <span id="guerra-timer">30s</span>
            </div>
            <div class="progress-bar-bg">
                <div id="guerra-vida-bar" class="progress-bar-fill"></div>
            </div>
        </div>

        <!-- OBJETO OCULTO: PALOMA DORADA -->
        <div id="paloma-dorada" class="golden-pigeon" style="display:none;" onclick="clickGolden()">⭐🐦⭐</div>

        <!-- ÁREA DE CLIC -->
        <div class="click-zone" id="click-zone">
            <div id="paloma-principal" onclick="clickPaloma(event)">🐦</div>
        </div>

        <!-- ACCIONES PRINCIPALES -->
        <div class="action-panel">
            <button id="btn-main-rebirth" class="btn btn-rebirth" onclick="hacerRebirth()">
                ✨ Hacer Rebirth <br>
                <small>(Costo: <span id="costo-rebirth-txt">50,000</span>)</small>
Usa el código con precaución.
⚖️ Ver Deudas


Nido de Producción
Migas de Pan
+0.2 PPS automáticos

15 Palomas
Entrenador de Palomas
+1.0 PPS automáticos

100 Palomas
Escudo de Plumas
Suma +1 Defensa anti-guerra

500 Palomas


// ESTADO DEL JUEGO
let palomas = 0;
let pps = 0.0;
let multiplicador = 1.0;
let defensas = 0;
let poder = 0;
let costoRebirth = 50000;
// Costos iniciales de mejoras
const costos = { migas: 15, entrenador: 100, escudo: 500 };
// FUNCIÓN DE CLIC PRINCIPAL
function clickPaloma(event) {
const ganancia = 1 * multiplicador;
palomas += ganancia;
actualizarPantalla();
crearEfectoFlotante(event, +${ganancia.toFixed(1)});
// Probabilidad aleatoria de que aparezca la paloma dorada (3%)
if (Math.random() < 0.03 && document.getElementById('paloma-dorada').style.display === 'none') {
aparecerPalomaDorada();
}
}
// ACTUALIZAR INTERFAZ
function actualizarPantalla() {
document.getElementById('contador').textContent = ${Math.floor(palomas)} Palomas;
document.getElementById('mult-txt').textContent = x${multiplicador.toFixed(1)};
document.getElementById('pps-txt').textContent = pps.toFixed(1);
document.getElementById('defensas-txt').textContent = defensas;
document.getElementById('poder-txt').textContent = poder;
document.getElementById('costo-rebirth-txt').textContent = costoRebirth.toLocaleString();
// Bloquear/Desbloquear visualmente las mejoras según el saldo
gestionarEstiloCompra('migas', costos.migas);
gestionarEstiloCompra('entrenador', costos.entrenador);
gestionarEstiloCompra('escudo', costos.escudo);
}
function gestionarEstiloCompra(id, costo) {
const elemento = document.getElementById(costo-${id}).parentElement;
if (palomas >= costo) {
elemento.classList.remove('disabled');
} else {
elemento.classList.add('disabled');
}
}
// COMPRAR MEJORAS
function comprarMejora(tipo) {
if (palomas >= costos[tipo]) {
palomas -= costos[tipo];
if (tipo === 'migas') {
pps += 0.2;
costos.migas = Math.ceil(costos.migas * 1.15);
document.getElementById('costo-migas').textContent = ${costos.migas} Palomas;
} else if (tipo === 'entrenador') {
pps += 1.0;
costos.entrenador = Math.ceil(costos.entrenador * 1.15);
document.getElementById('costo-entrenador').textContent = ${costos.entrenador} Palomas;
} else if (tipo === 'escudo') {
defensas += 1;
costos.escudo = Math.ceil(costos.escudo * 1.5);
document.getElementById('costo-escudo').textContent = ${costos.escudo} Palomas;
}
actualizarPantalla();
}
}
// MECÁNICA DE REBIRTH
function hacerRebirth() {
if (palomas >= costoRebirth) {
palomas = 0;
pps = 0;
defensas = 0;
multiplicador += 0.5; // El multiplicador aumenta permanentemente
poder += 1;          // El poder espiritual sube
costoRebirth = Math.ceil(costoRebirth * 2.5);
// Resetear costos de nidos
costos.migas = 15;
costos.entrenador = 100;
costos.escudo = 500;
document.getElementById('costo-migas').textContent = 15 Palomas;
document.getElementById('costo-entrenador').textContent = 100 Palomas;
document.getElementById('costo-escudo').textContent = 500 Palomas;
actualizarPantalla();
alert("✨ ¡Has renacido! Tu multiplicador permanente ha aumentado.");
} else {
alert("No tienes suficientes palomas para el Rebirth.");
}
}
// EFECTO VISUAL +1 FLOTANTE
function crearEfectoFlotante(event, texto) {
const zona = document.getElementById('click-zone');
const span = document.createElement('span');
span.className = 'floating-text';
span.textContent = texto;
// Calcular posición relativa al contenedor
const rect = zona.getBoundingClientRect();
const x = event.clientX - rect.left;
const y = event.clientY - rect.top;
span.style.left = ${x}px;
span.style.top = ${y}px;
zona.appendChild(span);
setTimeout(() => span.remove(), 800);
}
// EVENTO: PALOMA DORADA ALEATORIA
function aparecerPalomaDorada() {
const dorada = document.getElementById('paloma-dorada');
const zona = document.getElementById('click-zone');
const maxX = zona.clientWidth - 80;
const maxY = zona.clientHeight - 80;
dorada.style.left = ${Math.random() * maxX}px;
dorada.style.top = ${Math.random() * maxY}px;
dorada.style.display = 'block';
// Desaparece sola a los 5 segundos si no la clickeas
setTimeout(() => { dorada.style.display = 'none'; }, 5000);
}
function clickGolden() {
const bono = Math.max(50, palomas * 0.2); // 20% de tus palomas actuales o mínimo 50
palomas += bono;
document.getElementById('paloma-dorada').style.display = 'none';
alert(⭐ ¡Paloma Dorada capturada! +${Math.floor(bono)} Palomas);
actualizarPantalla();
}
// EVENTO AUTOMÁTICO: SISTEMA DE GUERRA (Cada 1 minuto, 20% probabilidad)
setInterval(() => {
if (Math.random() < 0.2 && document.getElementById('guerra-panel').style.display === 'none') {
activarGuerra();
}
}, 60000);
function activarGuerra() {
const panel = document.getElementById('guerra-panel');
const bar = document.getElementById('guerra-vida-bar');
const timerTxt = document.getElementById('guerra-timer');
panel.style.display = 'block';
let tiempoRestante = 15; // 15 segundos para defenderse
timerTxt.textContent = ${tiempoRestante}s;
bar.style.width = '100%';
const cuentaAtras = setInterval(() => {
tiempoRestante--;
timerTxt.textContent = ${tiempoRestante}s;
bar.style.width = ${(tiempoRestante / 15) * 100}%;
if (tiempoRestante <= 0) {
clearInterval(cuentaAtras);
panel.style.display = 'none';
// Consecuencia de la guerra si no tienes defensas
if (defensas > 0) {
defensas--;
alert("🛡️ ¡Tus defensas repelieron el ataque enemigo! Perdiste 1 Escudo.");
} else {
palomas = Math.floor(palomas * 0.5); // Pierdes la mitad
alert("💥 Perdiste la guerra. Los enemigos se llevaron el 50% de tus palomas.");
}
actualizarPantalla();
}
}, 1000);
}
// BUCLE PRINCIPAL (PRODUCCIÓN PPS)
setInterval(() => {
if (pps > 0) {
palomas += (pps / 10); // Ejecución cada 100ms para mayor fluidez
actualizarPantalla();
}
}, 100);
function alertaDeudas() {
alert("⚖️ El sistema de gestión de deudas del banco central de palomas estará disponible en la próxima actualización de expansión comercial.");
}
// Inicializar
actualizarPantalla();
