<!DOCTYPE html> <html lang="es"> <head> <meta charset="UTF-8"> <meta name="viewport"content="width=device-width, initial-scale=1.0"> <title>Perú Clicker - Premium Edition</title> <style> :root { --peru-red: #D91414; --peru-white: #FFFFFF; --dark-bg: #121212; --panel-bg: #1E1E1E; --accent-gold: #FFD700; --text-color: #E0E0E0; } body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--dark-bg); color: var(--text-color); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; user-select: none; } h1 { color: var(--peru-red); text-shadow: 2px 2px 4px rgba(0,0,0,0.5); margin-bottom: 5px; } .subtitle { font-style: italic; color: #888; margin-bottom: 20px; } .game-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 1000px; width: 100%; } @media (max-width: 768px) { .game-container { grid-template-columns: 1fr; } } .panel { background-color: var(--panel-bg); border-radius: 12px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); border: 1px solid #333; display: flex; flex-direction: column; } .click-section { align-items: center; justify-content: center; text-align: center; } .stats-display { font-size: 24px; margin: 15px 0; font-weight: bold; } .soles-text { color: #4CAF50; } .palomas-text { color: #00BCD4; } .flag-button { width: 200px; height: 130px; background: linear-gradient(to right, var(--peru-red) 33%, var(--peru-white) 33%, var(--peru-white) 66%, var(--peru-red) 66%); border: 4px solid #fff; border-radius: 10px; cursor: pointer; box-shadow: 0 6px 15px rgba(0,0,0,0.5); transition: transform 0.05s, box-shadow 0.1s; margin: 20px 0; position: relative; overflow: hidden; } .flag-button:active { transform: scale(0.95); box-shadow: 0 2px 5px rgba(0,0,0,0.5); } /* Tienda (Cerrando la sección cortada) */ .shop-title { border-bottom: 2px solid var(--peru-red); padding-bottom: 5px; margin-top: 0; } .shop-item { display: flex; justify-content: space-between; align-items: center; background: #2a2a2a; padding: 12px; margin: 8px 0; border-radius: 8px; border-left: 4px solid var(--accent-gold); } .item-info p { margin: 0; } .item-name { font-weight: bold; font-size: 16px; } .item-cost { font-size: 14px; color: #4CAF50; } .buy-btn { background-color: var(--peru-red); color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: background 0.2s; } .buy-btn:hover { background-color: #b00f0f; } .buy-btn:disabled { background-color: #555; cursor: not-allowed; } </style> </head> <body> <h1>Perú Clicker</h1> <div class="subtitle">Premium Edition</div> <div class="game-container"> <!-- Panel de Click -->


<div class="panel click-section"> <div class="stats-display"> <span class="soles-text"id="soles-count">0</span> Soles </div> <div style="font-size: 14px; color: #aaa;" id="sps-display"> Por segundo: S/. 0 </div> <button class="flag-button" id="click-btn"></button> <divstyle="font-size: 14px; color: #888;"> ¡Haz click en la bandera para trabajar! </div> </div><!-- Panel de la Tienda --> <div class="panel"> <h2 class="shop-title">Emprendimientos e Inversiones</h2> <div id="shop-container"> <!-- Los items se generan dinámicamente con JavaScript --> </div> </div> </div> <script> // Estado del juego let soles = 0; let solesPerSecond = 0; // Lista de items de la tienda const items = [ { id: 'mototaxi', name: 'Mototaxi Usada', cost: 15, sps: 0.1, count: 0 }, { id: 'cevichería', name: 'Puestito de Ceviche', cost: 100, sps: 1, count: 0 }, { id: 'chifa', name: 'Chifa de Barrio', cost: 1100, sps: 8, count: 0 }, { id: 'minera', name: 'Acciones en Mina de Cobre', cost: 12000, sps: 47, count: 0 } ]; // Elementos del DOM const solesDisplay = document.getElementById('soles-count'); const spsDisplay = document.getElementById('sps-display'); const clickBtn = document.getElementById('click-btn'); const shopContainer = document.getElementById('shop-container'); // Inicializar Tienda function renderShop() { shopContainer.innerHTML = ''; items.forEach((item, index) => { const itemEl = document.createElement('div'); itemEl.className = 'shop-item'; itemEl.innerHTML = ` <div class="item-info"> <p class="item-name">${item.name} (${item.count})</p> <p class="item-cost">Costo: S/. ${Math.floor(item.cost)} | +${item.sps}/s</p> </div> <button class="buy-btn" id="btn-${item.id}" onclick="buyItem(${index})">Comprar</button> `; shopContainer.appendChild(itemEl); }); updateButtons(); } // Actualizar estados de botones de compra function updateButtons() { items.forEach(item => { const btn = document.getElementById(`btn-${item.id}`); if (btn) { btn.disabled = soles < item.cost; } }); } // Lógica de click principal clickBtn.addEventListener('click', () => { soles += 1; updateUI(); }); // Comprar elemento window.buyItem = function(index) { const item = items[index]; if (soles >= item.cost) { soles -= item.cost; item.count++; item.cost *= 1.15; // Incrementa el costo un 15% recalculateSPS(); renderShop(); updateUI(); } }; // Recalcular ingresos pasivos function recalculateSPS() { solesPerSecond = items.reduce((sum, item) => sum + (item.count * item.sps), 0); } // Actualizar interfaz general function updateUI() { solesDisplay.textContent = Math.floor(soles); spsDisplay.textContent = `Por segundo: S/. ${solesPerSecond.toFixed(1)}`; updateButtons(); } // Bucle principal del juego (corre cada 100ms para mayor fluidez) setInterval(() => { soles += solesPerSecond / 10; updateUI(); }, 100); // Render inicial renderShop(); </script> </body> </html>
