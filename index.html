<script>
    // --- ESTADO DEL JUEGO ---
    let palomas = 0;
    let totalRebirths = 0;
    let multiplicadorRebirth = 1.0;
    let poderEspiritual = 0;
    let impuestoAcumulado = 0;
    let sunatCongelado = false;
    let palomasDefensoras = 0;
    let precioDefensorBase = 50;
    let halconesAtacando = false;
    let fuerzaAtaqueHalcon = 0;

    const acreedoresRandom = ["Caja Huancayo", "Banco Azteca", "Don Pepe", "Tía Veneno Finanzas", "Financiera Efectiva", "Caja Piura"];
    const conceptosRandom = ["Factura de Luz del Sur", "Arbitrios Municipales", "Línea del Metropolitano", "Inca Kola Familiar", "Factura emitida por Sedapal"];

    // --- BASE DE DATOS DEL JUEGO ---
    const tiendaObjetos = [
        { id: 1, nombre: "Combo Tía Veneno", costo: 15, pps: 0.2, cantidad: 0 },
        { id: 2, nombre: "Cobrador de Custer", costo: 100, pps: 1, cantidad: 0 },
        { id: 3, nombre: "Carrito Emolientero", costo: 500, pps: 5, cantidad: 0 },
        { id: 4, nombre: "Puesto en Polvos Azules", costo: 2500, pps: 25, cantidad: 0 },
        { id: 5, nombre: "Inca Kola Infinita", costo: 10000, pps: 120, cantidad: 0 }
    ];

    const habilidadesAncestrales = [
        { id: 1, nombre: "Ceviche Espiritual", costoPoder: 1, efecto: "Multiplica tus PPS por 1.5", comprado: false, multiplicador: 1.5 },
        { id: 2, nombre: "Llama Sagrada", costoPoder: 3, efecto: "Multiplica tus PPS por 2.0", comprado: false, multiplicador: 2.0 },
        { id: 3, nombre: "Bendición del Inti", costoPoder: 5, efecto: "Multiplica tus PPS por 3.0", comprado: false, multiplicador: 3.0 }
    ];

    const logros = [
        { id: 1, nombre: "Primer Vuelo", desc: "Consigue tu primera paloma.", req: () => palomas >= 1, desbloqueado: false },
        { id: 2, nombre: "Microempresario", desc: "Consigue 1,000 palomas.", req: () => palomas >= 1000, desbloqueado: false },
        { id: 3, nombre: "Rey de Gamarra", desc: "Consigue 50,000 palomas.", req: () => palomas >= 50000, desbloqueado: false },
        { id: 4, nombre: "Héroe del Aire", desc: "Recluta 5 palomas defensoras.", req: () => palomasDefensoras >= 5, desbloqueado: false }
    ];

    // --- LÓGICA PRINCIPAL ---
    function clickPaloma() {
        if (sunatCongelado) {
            alert("¡Tu cuenta está congelada por la SUNAT! Paga tu deuda primero.");
            return;
        }
        palomas += 1 * multiplicadorRebirth;
        actualizarPantalla();
        verificarLogros();
    }

    function calcularPPS() {
        let ppsBase = tiendaObjetos.reduce((total, obj) => total + (obj.pps * obj.cantidad), 0);
        let multHabilidades = habilidadesAncestrales.reduce((total, hab) => hab.comprado ? total * hab.multiplicador : total, 1);
        return ppsBase * multiplicadorRebirth * multHabilidades;
    }

    // --- SISTEMA ECONÓMICO Y TIENDA ---
    function comprarObjeto(id) {
        const item = tiendaObjetos.find(o => o.id === id);
        if (palomas >= item.costo) {
            palomas -= item.costo;
            item.cantidad++;
            item.costo = Math.floor(item.costo * 1.15); // Aumenta precio un 15%
            renderizarTienda();
            actualizarPantalla();
        }
    }

    function comprarDefensor() {
        let precio = precioDefensorBase + (palomasDefensoras * 25);
        if (palomas >= precio) {
            palomas -= precio;
            palomasDefensoras++;
            actualizarPantalla();
        }
    }

    // --- EVENTOS: SUNAT Y HALCONES ---
    function pagarImpuestos() {
        if (palomas >= impuestoAcumulado) {
            palomas -= impuestoAcumulado;
            impuestoAcumulado = 0;
            sunatCongelado = false;
            document.getElementById("sunat-status").innerText = "Al día";
            document.getElementById("sunat-status").style.color = "#5cd65c";
            actualizarPantalla();
        } else {
            alert("No tienes suficientes palomas para pagar la deuda coactiva.");
        }
    }

    function lanzarCrisisSunat() {
        if (sunatCongelado || palomas < 100) return;
        impuestoAcumulado = Math.floor(palomas * 0.20) + 50; 
        document.getElementById("deuda-acreedor").innerText = acreedoresRandom[Math.floor(Math.random() * acreedoresRandom.length)];
        document.getElementById("deuda-concepto").innerText = conceptosRandom[Math.floor(Math.random() * conceptosRandom.length)];
        document.getElementById("sunat-status").innerText = "¡EMBARGO COACTIVO!";
        document.getElementById("sunat-status").style.color = "#ff5733";
        sunatCongelado = true;
        actualizarPantalla();
    }

    function lanzarInvasionHalcon() {
        if (halconesAtacando) return;
        halconesAtacando = true;
        fuerzaAtaqueHalcon = Math.floor(Math.random() * 5) + 1 + totalRebirths;
        
        document.getElementById("halcon-status").innerText = "🚨 ¡INVASIÓN EN CURSO! 🚨";
        document.getElementById("halcon-status").style.color = "#ff5733";
        document.getElementById("halcon-fuerza").innerText = fuerzaAtaqueHalcon;

        setTimeout(() => {
            if (palomasDefensoras >= fuerzaAtaqueHalcon) {
                let recompensa = fuerzaAtaqueHalcon * 100;
                palomas += recompensa;
                alert(`¡Tus palomas defendieron el cielo con éxito! Ganaste ${recompensa} palomas.`);
            } else {
                let robadas = Math.floor(palomas * 0.30);
                palomas -= robadas;
                palomasDefensoras = 0;
                alert(`Los halcones eran muy fuertes. Destruyeron tus defensas y se llevaron ${robadas} palomas.`);
            }
            halconesAtacando = false;
            fuerzaAtaqueHalcon = 0;
            document.getElementById("halcon-status").innerText = "Zona Segura";
            document.getElementById("halcon-status").style.color = "#5cd65c";
            document.getElementById("halcon-fuerza").innerText = "0";
            actualizarPantalla();
        }, 6000); 
    }

    // --- PALOMA DE ORO ---
    function spawnPalomaOro() {
        const btnOro = document.getElementById("paloma-oro");
        let x = Math.random() * (window.innerWidth - 100);
        let y = Math.random() * (window.innerHeight - 100);
        btnOro.style.left = x + "px";
        btnOro.style.top = y + "px";
        btnOro.style.display = "block";
        
        setTimeout(() => { btnOro.style.display = "none"; }, 5000); 
    }

    function clickPalomaOro() {
        let pps = calcularPPS();
        let bono = Math.max(100, Math.floor(pps * 30));
        palomas += bono;
        document.getElementById("paloma-oro").style.display = "none";
        alert(`¡Clickaste la paloma de oro! +${bono} palomas.`);
        actualizarPantalla();
    }

    // --- REBIRTH Y ÁRBOL ANCESTRAL ---
    function hacerRebirth() {
        if (palomas >= 50000) {
            palomas = 0;
            totalRebirths++;
            multiplicadorRebirth += 0.5; 
            poderEspiritual += 1;
            
            tiendaObjetos.forEach(o => { o.cantidad = 0; });
            
            renderizarTienda();
            renderizarArbol();
            actualizarPantalla();
            alert("¡Has renacido! Ahora eres más fuerte y posees Poder Espiritual.");
        }
    }

    function comprarHabilidad(id) {
        const hab = habilidadesAncestrales.find(h => h.id === id);
        if (poderEspiritual >= hab.costoPoder && !hab.comprado) {
            poderEspiritual -= hab.costoPoder;
            hab.comprado = true;
            renderizarArbol();
            actualizarPantalla();
        }
    }

    // --- INTERFAZ DE USUARIO (RENDERS) ---
    function actualizarPantalla() {
        document.getElementById("contador").innerText = `${Math.floor(palomas).toLocaleString()} Palomas`;
        document.getElementById("pps-txt").innerText = calcularPPS().toFixed(1);
        document.getElementById("mult-txt").innerText = `x${multiplicadorRebirth.toFixed(1)}`;
        document.getElementById("rebirths-txt").innerText = totalRebirths;
        document.getElementById("poder-txt").innerText = poderEspiritual;
        document.getElementById("deuda-cantidad").innerText = impuestoAcumulado.toLocaleString();
        document.getElementById("defensores-cant").innerText = palomasDefensoras;
        
        let precioDef = precioDefensorBase + (palomasDefensoras * 25);
        document.getElementById("precio-defensor").innerText = precioDef;

        document.getElementById("btn-main-rebirth").disabled = palomas < 50000;
        document.getElementById("btn-pagar-deuda").disabled = palomas < impuestoAcumulado || impuestoAcumulado === 0;
        document.getElementById("btn-comprar-defensor").disabled = palomas < precioDef;

        // Actualizar dinámicamente el estado de deshabilitado de los botones de la tienda
        tiendaObjetos.forEach(item => {
            const btn = document.getElementById(`btn-tienda-${item.id}`);
            if (btn) btn.disabled = palomas < item.costo;
        });

        // Actualizar los botones del árbol de habilidades
        habilidadesAncestrales.forEach(hab => {
            const btn = document.getElementById(`btn-hab-${hab.id}`);
            if (btn) btn.disabled = poderEspiritual < hab.costoPoder || hab.comprado;
        });
    }

    function renderizarTienda() {
        const contenedor = document.getElementById("contenedor-tienda");
        contenedor.innerHTML = "";
        tiendaObjetos.forEach(item => {
            contenedor.innerHTML += `
                <div class="fila-item">
                    <div class="info">
                        <strong>${item.nombre} (x${item.cantidad})</strong>
                        Precio: ${item.costo} P. | +${item.pps} PPS c/u
                    </div>
                    <button id="btn-tienda-${item.id}" onclick="comprarObjeto(${item.id})">Comprar</button>
                </div>
            `;
        });
    }

    function renderizarArbol() {
Usa el código con precaución.
const contenedor = document.getElementById("contenedor-rebirth");
contenedor.innerHTML = "";
habilidadesAncestrales.forEach(hab => {
contenedor.innerHTML += <div class="fila-item fila-rebirth"> <div class="info"> <strong>${hab.nombre}</strong> ${hab.efecto} | Costo: ${hab.costoPoder} P.E. </div> <button id="btn-hab-${hab.id}" onclick="comprarHabilidad(${hab.id})"> ${hab.comprado ? 'Adquirido' : 'Desbloquear'} </button> </div>;
});
}
function renderizarLogros() {
const contenedor = document.getElementById("contenedor-logros");
contenedor.innerHTML = "";
logros.forEach(logro => {
let clase = logro.desbloqueado ? "logro-desbloqueado" : "logro-bloqueado";
contenedor.innerHTML += <div class="fila-item ${clase}"> <div class="info"> <strong>${logro.nombre}</strong> ${logro.desc} </div> <span style="font-size:16px;">${logro.desbloqueado ? '🏆' : '🔒'}</span> </div>;
});
}
function verificarLogros() {
let cambios = false;
logros.forEach(logro => {
if (!logro.desbloqueado && logro.req()) {
logro.desbloqueado = true;
cambios = true;
}
});
if (cambios) renderizarLogros();
}
// --- BUCLE PRINCIPAL DEL JUEGO (GAME LOOP) ---
setInterval(() => {
if (!sunatCongelado) {
palomas += calcularPPS() / 10;
}
actualizarPantalla();
verificarLogros();
}, 100);
// Eventos Aleatorios
setInterval(() => { if (Math.random() < 0.15) lanzarCrisisSunat(); }, 20000);
setInterval(() => { if (Math.random() < 0.20) lanzarInvasionHalcon(); }, 30000);
setInterval(() => { if (Math.random() < 0.30) spawnPalomaOro(); }, 15000);
// Inicialización del juego al cargar
renderizarTienda();
renderizarArbol();
renderizarLogros();
actualizarPantalla();
